# crostini · CHG-013 — Cloudflare 1.1.1.1 for Families (malware + adult, 1.1.1.3) via DoH
# listen_addresses empty: systemd socket activation (127.0.2.1:53)
# Official WARP (warp-svc) cannot run on Crostini — no ip rule / RTM_GETRULE.
listen_addresses = []
server_names = ['cloudflare-family']
ipv6_servers = false
require_dnssec = false
require_nofilter = false
require_nolog = true

[sources]
  [sources.'public-resolvers']
  url = 'https://download.dnscrypt.info/resolvers-list/v2/public-resolvers.md'
  cache_file = '/var/cache/dnscrypt-proxy/public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 72
  prefix = ''
