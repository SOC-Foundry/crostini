#? Config file for btop v. 1.3.2
# crostini · CHG-015 — only the knobs that differ from Debian defaults

#* Read disks list from /etc/fstab. This also disables only_physical.
#* penguin has no /etc/fstab. Default True → Mem::collect() filesystem error.
use_fstab = False

#* Show cpu temperature.
#* No useful hwmon. thermal_zone0 is a battery stub (0 °C).
check_temp = False

#* If gpu info should be shown in the cpu box. Available values = "Auto", "On" and "Off".
#* Guest has no DRM / GPU.
show_gpu_info = "Off"

#* Starts with the Network Interface specified here.
net_iface = "eth0"
